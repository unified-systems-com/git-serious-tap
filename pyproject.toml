# git-serious — a TAP product: an umbrella plugin whose in-package boot record IS the product
# composition (plan/product-map.md, "A product is an over-arching plugin with its own repo").
#
# Identity chain (req-tap-plugin-arch-identity, gate-enforced; the <slug>-tap convention since
# 2026-08-26, req-tap-plugin-arch-identity-2):
#   slug             = "git_serious"                  (tap-plugin.toml slug — never renames)
#   distribution     = "git-serious-tap"              (PEP 503: slug `_`->`-`, `-tap` suffix)
#   import namespace = "tap_plugin.git_serious"       (PEP 420 native namespace; NO tap_plugin/__init__.py)
#   entry-point key  = "git_serious"                  (== slug)
[project]
name = "git-serious-tap"
description = "git-serious — visualize, track, and secure your CI/CD system, for humans and agents. A TAP product."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dynamic = ["version"]

# Tier-0 install dependencies (req-tap-plugin-arch-dependencies-1). git-serious is a
# composition: it ships no models or collectors of its own, but its pages reference these
# plugins' ENTITY TYPES by string (github_core__*, identity_core__oidc_issuer) in Gryphon, and
# its boot record fires github_core's collector — so they must be INSTALLED, which is a real
# install dep even though nothing here imports their Python (hence NOT a code `depends_on`,
# the samsite precedent). Dependencies are referenced by the name they are currently
# published under; the legacy tap-plugin-* names rename in the tap#147 wave.
dependencies = [
    "git-core-tap>=0.1.0,<0.2",
    # FLOOR 0.11.0. Two separate facts hold it up. The PAGES need >= 0.7.0: the
    # repository page's GRIFT matches the entity type `github_core__pull_request`
    # and reads `github_repository.pull_requests_total`, `.custom_properties`,
    # `.custom_properties_observability` and `.pull_requests_observability`, none of
    # which exist before v0.7.0. The floor sits at 0.11.0 rather than 0.7.0 because
    # that is the release whose types declare CONTAINMENT_EDGES and ship the
    # [falsifiers] declaration (tap-plugin-github-core#151): before it, retiring an
    # observed-gone node left its children behind with nothing to cascade through.
    # v0.11.0 also requires core >= 0.2.0, which is why this plugin's requires_tap
    # floor moves in the same commit. Ceiling stays one minor wide by convention —
    # it records the highest version actually verified against these pages, not a
    # promise about the one after. CEILING WIDENED TO 0.12 (git-serious-tap#113):
    # every github_core__* entity/edge type these pages, searches and boot record
    # reference (17 symbols) still exists at v0.12.2 with the same shape; v0.12
    # additionally ships a retry/backoff seam (`github_call.py`) the 0.11 line never
    # had, which the running instance's collector needed. Verified live: pre-boot's
    # conformance and compatibility gates pass and every git_serious bundle still
    # seeds against an editable v0.12.2 checkout.
    "tap-plugin-github-core>=0.11.0,<0.13",
    "tap-plugin-identity-core",
    "tap-plugin-administrivia",
]

[project.entry-points."tap.plugins"]
git_serious = "tap_plugin.git_serious.apps:GitSeriousConfig"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
only-include = ["tap_plugin/git_serious"]
