# git-serious — a TAP product: an umbrella plugin whose in-package boot record IS the product
# composition (plan/product-map.md, "A product is an over-arching plugin with its own repo").
#
# Identity chain (req-tap-plugin-arch-identity, gate-enforced; the <slug>-tap convention since
# 2026-08-26, req-tap-plugin-arch-identity-2):
#   slug             = "git_serious"                  (tap-plugin.toml slug — never renames)
#   distribution     = "git-serious-tap"              (PEP 503: slug `_`->`-`, `-tap` suffix)
#   import namespace = "tap_plugin.git_serious"       (PEP 420 native namespace; NO tap_plugin/__init__.py)
#   entry-point key  = "git_serious"                  (== slug)
[project]
name = "git-serious-tap"
description = "git-serious — visualize, track, and secure your CI/CD system, for humans and agents. A TAP product."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dynamic = ["version"]

# Tier-0 install dependencies (req-tap-plugin-arch-dependencies-1). git-serious is a
# composition: it ships no models or collectors of its own, but its pages reference these
# plugins' ENTITY TYPES by string (github_core__*, identity_core__oidc_issuer) in Gryphon, and
# its boot record fires github_core's collector — so they must be INSTALLED, which is a real
# install dep even though nothing here imports their Python (hence NOT a code `depends_on`,
# the samsite precedent). Dependencies are referenced by the <slug>-tap name they are
# published under (github-core-tap from v0.13.0, identity-core-tap from v0.1.4,
# administrivia-tap from v0.2.1).
dependencies = [
    "git-core-tap>=0.1.0,<0.2",
    # FLOOR 0.13.0, the first release published as github-core-tap. The PAGES need >= 0.7.0
    # (the repository page's GRIFT matches `github_core__pull_request` and reads
    # `github_repository.pull_requests_total`, `.custom_properties`,
    # `.custom_properties_observability` and `.pull_requests_observability`), and the 0.11.0
    # floor this replaces was the release whose types declare CONTAINMENT_EDGES and ship the
    # [falsifiers] declaration (tap-plugin-github-core#151): before it, retiring an
    # observed-gone node left its children behind. 0.13.0 carries both. CEILING <0.15: the CI
    # record boots v0.14.0 (zizmor v0.1.1 requires 0.14.x), which is the highest line this
    # plugin's own tests have run against. The 17-symbol check of the entity and edge types the
    # pages, searches and boot record reference (git-serious-tap#113) was last done at v0.12.2;
    # it was not repeated for 0.13/0.14, so CI's boot-and-test is the evidence for those.
    "github-core-tap>=0.13.0,<0.15",
    "identity-core-tap>=0.1.4",
    "administrivia-tap>=0.2.1",
]

[project.entry-points."tap.plugins"]
git_serious = "tap_plugin.git_serious.apps:GitSeriousConfig"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
only-include = ["tap_plugin/git_serious"]
