manifest_version = "0"
plugin_version = "0.1.0"
requires_tap = ">=0.1.6"
slug = "git_serious"
name = "git-serious"
description = "Visualize, track, and secure your CI/CD system — for humans and agents. A TAP product composed of github_core + identity_core + administrivia via the in-package boot record."

# No code-import dependencies: git-serious references other plugins' ENTITY TYPES by string
# (Gryphon in its pages) and fires github_core's collector from its boot record — both are
# INSTALL deps (pyproject `dependencies`), not import-time edges. See pyproject.toml.
depends_on = [
    { slug = "administrivia", note = "The product record seeds administrivia's admin pages beside the landing; the landing links to them." },
    { slug = "github_core", note = "The landing, org and repository pages are GRIFT over github_core's vocabulary (searches name github_core__* types; the machinery projection is github_core's)." },
    { slug = "zizmor", optional = true, note = "The secrets pages read zizmor's FLAGS_WORKFLOW findings onto each consuming workflow WHEN the scanner is installed (panels/secrets.py, guarded import); without it the findings column is absent, not empty. Soft: git-serious does not require the scanner." },
]

# Pure composition — no crypto, no native deps (spec-fips.md, req-tap-plugin-manifest-v0-fips).
[fips]
status = "compatible"

[grift]
landing = "grift/landing.grift.json"
org = "grift/org.grift.json"
gate = "grift/gate.grift.json"
schedule = "grift/schedule.grift.json"
repository = "grift/repository.grift.json"
secrets = "grift/secrets.grift.json"
queries = "grift/queries.grift.json"

# In-package boot record (req-boot-bootstrap-records-in-package): THE product composition.
# Digest is the canonical sha256 of the record (sorted keys, tight separators) — regenerate
# with scripts/boot-record-hash --refresh in a core checkout, or the shipped
# test_boot_record_resolves digest assertion; never hand-edit.
[[boot.records]]
name = "git_serious"
description = "git-serious standing against one GitHub account: github_core (account-scoped collector) + identity_core + administrivia + the git-serious landing page. required_secrets declares the read-only github_pat."
sha256 = "5faa2369989ea424630f98788444e883a0cd2ca2d17391fac8bbc49adab2542c"

[[boot.records]]
name = "ci"
description = "RESERVED NAME (req-boot-bootstrap-ci-record): the stack this plugin's own tests run in — depends_on closure + self, offline, credential-free. The consumer flips self to editable."
sha256 = "5fcc6ef43139cb0a2a5726342f2fa2dfa49973fcf33557d0a3bd5d7ccc079be1"
